# TrueType font metrics for Lyrion Music Server display rendering.
# See display-font-prefs.md for format documentation.

# ---------------------------------------------------------------------------
# CODE2000 — Shareware (donation requested), included, downloaded from https://www.code2001.com/index.htm
# ---------------------------------------------------------------------------
[ttf:CODE2000.TTF]
standard.1  9   8
standard.2  14  28
light.1     10  10
light.2     11  29
full.2      24  25
high.2      7   7
uc standard.1
alias standard_n.1 standard.1
alias standard_n.2 standard.2
alias light_n.1    light.1
alias light_n.2    light.2
alias full_n.2     full.2

# ---------------------------------------------------------------------------
# Cyberbit — Free for non-commercial use, can be downloaded from https://www.minix3.org/distfiles-backup/cyberbit-ttf/Cyberbit.ZIP
# ---------------------------------------------------------------------------
[ttf:Cyberbit.ttf]
standard.1  9   8
standard.2  14  28
light.1     10  10
light.2     11  29
full.2      24  25
high.2      7   7
uc standard.1
alias standard_n.1 standard.1
alias standard_n.2 standard.2
alias light_n.1    light.1
alias light_n.2    light.2
alias full_n.2     full.2

[ttf:CYBERBIT.TTF]
alias * Cyberbit.ttf

# ---------------------------------------------------------------------------
# FreeSans — GNU FreeFont Sans, included, can also be downloaded from https://ftp.gnu.org/gnu/freefont/, https://savannah.gnu.org/projects/freefont/
# ---------------------------------------------------------------------------
[ttf:FreeSans.ttf]
standard.1  9   9
standard.2  14  29
light.1     10  10
light.2     11  30
full.2      24  25
high.2      7   8
uc standard.1
alias standard_n.1 standard.1
alias standard_n.2 standard.2
alias light_n.1    light.1
alias light_n.2    light.2
