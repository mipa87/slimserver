# ---------------------------------------------------------------------------
# Fallback — used for any TTF font not listed above
# ---------------------------------------------------------------------------
[ttf:*]
standard.1  9   8
standard.2  14  28
light.1     10  10
light.2     11  29
full.2      24  25
high.2      7   7
uc standard.1
alias standard_n.1 standard.1
alias standard_n.2 standard.2
alias light_n.1    light.1
alias light_n.2    light.2
alias full_n.2     full.2
