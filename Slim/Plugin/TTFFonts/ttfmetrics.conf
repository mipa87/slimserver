# ---------------------------------------------------------------------------
# DejaVu Sans
# ---------------------------------------------------------------------------
[ttf:DejaVuSans.ttf]
standard.1  6   8
standard.2  13  28
light.1     10   11
light.2     10   29
full.2      22  26
high.2      6   7
uc standard.1
alias standard_n.1 standard.1
alias standard_n.2 standard.2
alias light_n.1    light.1
alias light_n.2    light.2
alias full_n.2     full.2

[ttf:DejaVuSans-Bold.ttf]
alias * DejaVuSans.ttf

[ttf:DejaVuSans-ExtraLight.ttf]
alias * DejaVuSans.ttf

[ttf:DejaVuSansMono.ttf]
alias * DejaVuSans.ttf

# ---------------------------------------------------------------------------
# Noto Sans
