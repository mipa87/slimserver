[ttf:NotoSans-SemiBold.ttf]
alias * NotoSans-Regular.ttf

[ttf:NotoSans-Thin.ttf]
alias * NotoSans-Regular.ttf

[ttf:NotoSans_SemiCondensed-ExtraLight.ttf]
alias * NotoSans-Regular.ttf

[ttf:NotoSans_SemiCondensed-Light.ttf]
alias * NotoSans-Regular.ttf

[ttf:NotoSans_SemiCondensed-Medium.ttf]
alias * NotoSans-Regular.ttf

[ttf:NotoSans_SemiCondensed-Regular.ttf]
alias * NotoSans-Regular.ttf

[ttf:NotoSans_SemiCondensed-SemiBold.ttf]
alias * NotoSans-Regular.ttf

[ttf:NotoSans_SemiCondensed-Thin.ttf]
